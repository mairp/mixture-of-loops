name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # README promises Python 3.10 or newer, standard library only.
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install shellcheck
        run: shellcheck --version || (sudo apt-get update && sudo apt-get install -y shellcheck)

      - name: Syntax-check every script
        run: |
          bash -n bin/onboard-skill
          python3 -m compileall -q skills tests

      - name: Run the hermetic suite (Tiers 1 and 2)
        # Tier 2 skips itself when pi or prime-agent is absent; Tier 3 stays
        # opt-in behind MOL_LIVE_E2E, so this run never calls a model.
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests -v

  ci:
    # One stable check name for branch protection and Mergify to require,
    # independent of how many entries the matrix above has.
    name: ci
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: Report the matrix result
        run: |
          echo "tests: ${{ needs.test.result }}"
          test "${{ needs.test.result }}" = "success"
