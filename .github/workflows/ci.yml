name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    # Tier 1 takes well under a minute per version; a job still running after
    # ten is hung, and should fail rather than hold a runner for six hours.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # README promises Python 3.10 or newer, standard library only.
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install shellcheck
        run: shellcheck --version || (sudo apt-get update && sudo apt-get install -y shellcheck)

      - name: Syntax-check every script
        # Parse only. compileall would write __pycache__ into the fixture
        # repositories under tests/fixtures/repos, and those two trees are
        # asserted to be byte-identical apart from the approval file.
        run: |
          bash -n bin/onboard-skill
          python3 - <<'PY'
          import ast, pathlib, sys
          failed = False
          for path in sorted(pathlib.Path(".").rglob("*.py")):
              try:
                  ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              except SyntaxError as error:
                  print(f"{path}: {error}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: Run the hermetic suite (Tiers 1 and 2)
        # Tier 2 skips itself when pi or prime-agent is absent; Tier 3 stays
        # opt-in behind MOL_LIVE_E2E, so this run never calls a model.
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests -v

  ci:
    # One stable check name for branch protection and Mergify to require,
    # independent of how many entries the matrix above has.
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test]
    if: always()
    steps:
      - name: Report the matrix result
        run: |
          echo "tests: ${{ needs.test.result }}"
          test "${{ needs.test.result }}" = "success"
