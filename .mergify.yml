queue_rules:
  - name: default
    merge_method: squash

merge_protections_settings:
  # Label-gated auto-merge: a pull request carrying `automerge` is queued as
  # soon as the protections below pass. Everything else waits to be merged by
  # hand or with the `@mergifyio queue` command.
  auto_merge_conditions:
    - label = automerge

merge_protections:
  - name: ci-must-pass
    if:
      - base = main
    success_conditions:
      # `ci` is the single gate job that fans in the whole test matrix.
      - check-success = ci

# Head branches are deleted by GitHub's own delete_branch_on_merge repository
# setting, not from here. The pull_request_rules engine is not evaluated on
# this repository: both the `queue` action and `delete_head_branch` were
# silently ignored, so keeping a rule here would only look like coverage.
