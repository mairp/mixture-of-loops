queue_rules:
  - name: default
    merge_method: squash

merge_protections_settings:
  # Label-gated auto-merge: a pull request carrying `automerge` is queued as
  # soon as the protections below pass. Everything else waits to be merged by
  # hand or with the `@mergifyio queue` command.
  auto_merge_conditions:
    - label = automerge

merge_protections:
  - name: ci-must-pass
    if:
      - base = main
    success_conditions:
      # `ci` is the single gate job that fans in the whole test matrix.
      - check-success = ci

pull_request_rules:
  - name: Delete the head branch after merge
    conditions:
      - merged
    actions:
      delete_head_branch: {}
